name: CampusConnect CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Python checks and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate required files
        run: |
          for f in app.py database.py templates/index.html static/css/style.css static/js/script.js; do
            test -f "$f" || { echo "Missing required file: $f"; exit 1; }
          done

      - name: Check Python syntax
        run: |
          python -m py_compile app.py database.py

      - name: Run tests
        run: |
          if [ -d tests ] || ls test*.py >/dev/null 2>&1; then
            python -m pytest -v
          else
            echo "No test files found. Skipping pytest."
          fi
